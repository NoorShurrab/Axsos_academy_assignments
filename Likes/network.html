<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Likes</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <div class="content">
        <header>
            <h1>Network</h1>
        </header>
        <main>
            <h2>Your Feed</h2>
            <div class="allitems">
                <section class="itemOne">
                    <div class="info">
                        <img src="images/user-circle.png" alt="user" width="120px" height="120px"/>
                        <a href="#">Add an avatar</a>
                        <h5>James Doe</h5>
                    </div>
                </section>
                <section class="itemtwo">
                    <section class="num_two">
                        <div class="two">
                            <h3>Neil M</h3>
                            <div class="innerlike1">
                                <span class="numOfLike1">9 like(s)</span>
                                <button class="allLike">Like</button>
                            </div>
                        </div>
                        <p>I just set up this new discord bot, let me<br>know what you all think. <a href="#">link</a></p>
                        </section>
                     <section class="num_two">
                        <div class="two">
                            <h3>Nichole K</h3>
                            <div class="innerlike1">
                                <span class="numOfLike1">12 like(s)</span>
                                <button class="allLike">Like</button>
                            </div>
                        </div>
                        <p>Just finised my <a href="#">next comic,</a> check it out.</p>
                        </section>
                         <section class="num_two">
                        <div class="two">
                            <h3>Jim R</h3>
                            <div class="innerlike1">
                                <span class="numOfLike1">9 like(s)</span>
                                <button class="allLike">Like</button>
                            </div>
                        </div>
                        <p>I can't stop listening to the <a href="#">new album.</a>who else is liking it?</p>
                        </section>
                </section>
            </div>
        </main>
    </div>
    <script src="app.js"></script>
</body>
</html>
