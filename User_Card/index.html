<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User_Card</title>
    <link rel="stylesheet" href="style.css"/>
</head>
<body>
    <section class="user-card">
        <header>
            <img src="Icon/user-circle.png" alt="User Image"/>
        </header>
    <div class="user_info">
            <h2>Jane Doe</h2>
            <p class="location"><img src="Icon/map-marker.png" alt="Location Icon"/> Seattle</p>
            <ul>
                <li>Developer &#124; Engineer &#124; Problem Solver</li>
                <li>Master of shadows and the Internet!</li>
            </ul>
            <p class="setting"><img src="Icon/gear.png" alt="Settings Icon"/><a href="#">edit profile</a></p>
        
    </div>
        
    </section>
    
</body>
</html>
